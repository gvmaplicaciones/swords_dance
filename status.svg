<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Fondo gris oscuro -->
  <defs>
    <radialGradient id="stg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#888888"/>
      <stop offset="100%" stop-color="#444444"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="5" fill="url(#stg)"/>
  <!-- Círculo exterior -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- Línea horizontal que divide el círculo (mitad inferior oscura) -->
  <path d="M5 16 Q16 16 27 16" stroke="white" stroke-width="2.5"/>
  <!-- Semicírculo inferior relleno -->
  <path d="M5,16 A11,11 0 0,0 27,16 Z" fill="white" opacity="0.85"/>
  <!-- Punto central -->
  <circle cx="16" cy="16" r="2.5" fill="#555"/>
</svg>
